services:
  mariadb:
    container_name: web-mariadb-12
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: myWebCalculatorDb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    volumes:
      - ./mariadb-data:/var/lib/mysql
    ports:
      - "0.0.0.0:5042:3306"

  zookeeper:
    container_name: kafka-zookeeper-12
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "0.0.0.0:2181:2181"

  kafka:
    container_name: kafka-broker-12
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "0.0.0.0:9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
 
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://93.88.178.186:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    container_name: kafka-ui-12
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "0.0.0.0:10026:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  web:
    container_name: web-app-calculator-12
    hostname: app
    build: .
    ports:
      - "0.0.0.0:5012:5012"
    depends_on:
      - mariadb
      - kafka