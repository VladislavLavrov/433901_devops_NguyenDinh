services:
  mariadb:
    container_name: web-mariadb-12
    hostname: mariadb
    image: mariadb:10.5
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: myWebCalculatorDb
      MARIADB_USER: webdb
      MARIADB_PASSWORD: password
    ports:
      - "0.0.0.0:5012:3306"

  web:
    container_name: web-app-calculator-12
    hostname: app
    build: .
    ports:
      - "0.0.0.0:5012:5012"
    depends_on:
      - mariadb